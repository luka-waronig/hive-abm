[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-abm"
version = "0.1.0"
description = "Agent-based model for decentralized Hive coordination experiments."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "plotly>=5.22",
    "pytest>=8.0",
    "streamlit>=1.36",
]

[tool.setuptools.packages.find]
include = ["hive_abm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
